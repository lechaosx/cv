    title_en: Software Developer
    title_cs: Softwarový vývojář
    description_en: Worked on BlueSkyPlan, a product for dental treatment planning. As a member of a
      Geometry Team, I spent most of the time researching, implementing, and optimizing advanced
      algorithms and data structures for mesh and voxel data. I worked at spatial query
      acceleration, vertical and horizontal parallelism, robust mesh booleans, and more. As part of
      a cloud computing initiative, I led the development of a new, platform-independent build
      architecture for the existing codebase based on modern CMake and Conan.
    description_cs: Práce na BlueSkyPlan, produktu pro plánování stomatologických zákroků. Jako člen
      týmu geometrie jsem se převážně věnoval výzkumu, implementaci a optimalizaci pokročilých
      algoritmů a datových struktur pro polygonální sítě a voxelová data. Pracoval jsem na
      zrychlování prostorových dotazů, vertikálním a horizontálním paralelismu, robustních
      booleovských operacích nad sítěmi a dalších tématech. V rámci iniciativy zaměřené na cloudové
      výpočty jsem vedl vývoj nové, platformově nezávislé architektury sestavování existujícího kódu
      založené na moderním CMake a Conanu.
