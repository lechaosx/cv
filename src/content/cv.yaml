position_en: Senior Software Engineer
position_cs: Seniorní softwarový inženýr
description_en: >-
  I specialize in C++ and backend systems, with experience in computational geometry,
  performance optimization, legacy code modernization, production infrastructure, and technical
  leadership.


  My approach has evolved from solving difficult technical problems to understanding which
  problems are worth solving, how to manage their risks, and how to help other engineers succeed.
description_cs: >-
  Specializuji se na C++ a backendové systémy. Mám zkušenosti s výpočetní geometrií,
  optimalizací výkonu, modernizací staršího softwaru, produkční infrastrukturou i technickým
  vedením.


  Můj přístup se posunul od řešení náročných technických problémů k pochopení, které problémy
  stojí za to řešit, jak zvládat jejich rizika a jak pomáhat ostatním vývojářům uspět.
headline_en: I make complex software easier to understand, maintain, and evolve
headline_cs: Zpřehledňuji složitý software a usnadňuji jeho údržbu a další rozvoj
