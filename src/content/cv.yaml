position_en: Senior Software Engineer
position_cs: Seniorní softwarový inženýr
description_en: >-
  Focused on C++ and backend systems, with a background in computational geometry, performance
  optimization, legacy modernization, production migrations, and technical leadership.


  Most interested in deciding which problems are worth solving, making their risks explicit, and
  helping other engineers own their work.
description_cs: >-
  Zaměřuji se na C++ a backendové systémy. Mám zkušenosti s výpočetní geometrií, optimalizací
  výkonu, modernizací staršího softwaru, produkčními migracemi i technickým vedením.


  Zajímá mě, které problémy stojí za to řešit, jak pojmenovat jejich rizika a jak pomáhat kolegům
  převzít odpovědnost za vlastní práci.
headline_en: I make complex software easier to understand, maintain, and evolve
headline_cs: Zpřehledňuji složitý software a usnadňuji jeho údržbu a další rozvoj
