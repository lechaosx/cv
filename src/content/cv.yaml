position_en: Senior Software Engineer
position_cs: Seniorní softwarový inženýr
description_en: >-
  I’m a senior software engineer working on C++ systems and backend infrastructure, with experience
  in computational geometry, performance optimization, and technical leadership.


  My approach has evolved from solving difficult technical problems to understanding which problems
  are worth solving, how to manage their risks, and how to help other engineers succeed.
description_cs: >-
  Jsem seniorní softwarový inženýr se zkušenostmi s C++ systémy, backendovou infrastrukturou,
  výpočetní geometrií, optimalizací výkonu a technickým vedením.


  Od řešení náročných technických problémů jsem se postupně posunul k pochopení toho, které problémy
  stojí za to řešit, jak zvládat jejich rizika a jak pomáhat ostatním vývojářům uspět.
headline_en: I make complex software easier to understand, maintain, and evolve
headline_cs: Zpřehledňuji složitý software a usnadňuji jeho údržbu a další rozvoj
